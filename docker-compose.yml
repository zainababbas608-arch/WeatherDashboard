services:
  weather-app:
    build: .
    image: weather-app-image
    container_name: weather-app
    ports:
      - "5000:5000"
      - "5173:5173"
    environment:
      FIREBASE_KEY_PATH: /secrets/serviceAccountKey.json
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
    volumes:
      - ./backend/serviceAccountKey.json:/secrets/serviceAccountKey.json:ro